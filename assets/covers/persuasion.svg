<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF0E6"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D4A2B"/>
      <stop offset="100%" stop-color="#B68A3E"/>
    </linearGradient>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 82px; font-weight: 700; fill: #2D4A2B; letter-spacing: -0.02em; }
      .author { font-family: Arial, Helvetica, sans-serif; font-size: 56px; font-weight: 600; fill: #2D4A2B; letter-spacing: 0.03em; }
      .genre { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #2D4A2B; letter-spacing: 0.18em; }
      .mark { font-family: Georgia, 'Times New Roman', serif; font-size: 230px; font-weight: 700; fill: #2D4A2B; opacity: 0.10; }
      .brand { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #2D4A2B; letter-spacing: 0.14em; }
    </style>
  </defs>
  <rect width="1200" height="1800" rx="44" fill="url(#bg)"/>
  <rect x="90" y="90" width="1020" height="1620" rx="32" fill="none" stroke="#2D4A2B" stroke-opacity="0.18" stroke-width="4"/>
  <circle cx="970" cy="240" r="165" fill="#94B28C" opacity="0.45"/>
  <circle cx="830" cy="1440" r="230" fill="#94B28C" opacity="0.28"/>
  <rect x="90" y="124" width="1020" height="18" rx="9" fill="url(#band)"/>
  <text x="600" y="1280" text-anchor="middle" class="mark">P</text>
  <text x="90" y="220" class="genre">ROMANCE</text>
  <text x="90" y="360" class="title">Persuasion</text>
  <line x1="90" y1="980" x2="1110" y2="980" stroke="#2D4A2B" stroke-opacity="0.16" stroke-width="3"/>
  <text x="90" y="1090" class="author">Jane Austen</text>
  <rect x="90" y="1580" width="320" height="64" rx="32" fill="#2D4A2B"/>
  <text x="250" y="1622" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="0.14em" fill="#ffffff">READSHELF EDITION</text>
  <text x="1110" y="1624" text-anchor="end" class="brand">READSHELF</text>
</svg>