<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="View book information, reading availability, and save a title to your ReadShelf library.">
  <title>Book — ReadShelf</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-shell">
      <a class="brand" href="index.html"><img src="assets/logo.svg" alt=""><span>ReadShelf</span></a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="shelf.html">My Shelf <span class="shelf-count" data-shelf-count>0</span></a>
      </nav>
      <div class="nav-actions">
        <a class="btn btn-secondary" href="signin.html">Sign in</a>
        <a class="btn btn-primary" href="signin.html?mode=signup">Create account</a>
        <button class="mobile-menu" data-menu-toggle aria-expanded="false" aria-label="Open menu">☰</button>
      </div>
    </div>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a href="index.html">Home</a><a href="browse.html">Browse</a><a href="shelf.html">My Shelf</a>
    </nav>
  </header>

  <main class="detail-wrap">
    <div class="container">
      <nav class="detail-breadcrumb" aria-label="Breadcrumb">
        <a href="browse.html">Browse</a><span>›</span><span id="breadcrumbTitle">Book details</span>
      </nav>
      <section class="book-detail" id="bookDetail" aria-live="polite"></section>

      <section class="detail-related" id="relatedSection" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Keep exploring</p>
            <h2>You may also like</h2>
          </div>
          <a class="text-link" href="browse.html">Browse all books →</a>
        </div>
        <div class="book-grid detail-related-grid" id="relatedBooks"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand" href="index.html"><img src="assets/logo.svg" alt=""><span>ReadShelf</span></a>
      <span>CISC 4900 project · <span data-current-year></span></span>
      <div class="footer-links"><a href="browse.html">Browse</a><a href="shelf.html">My Shelf</a></div>
    </div>
  </footer>

  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-client.js"></script>
  <script src="js/google-books-config.js"></script>
  <script src="js/google-books.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/book.js"></script>
</body>
</html>
