<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reader — ReadShelf</title><link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/styles.css"></head><body class="reader-body">
<header class="reader-header"><div class="container reader-header-inner"><a class="text-link" href="browse.html">← Library</a><div class="reader-header-title"><strong id="readerBookTitle">Book</strong><span id="readerAuthor">Author</span></div><div class="reader-header-actions"><a class="btn btn-secondary btn-small" href="shelf.html">My Shelf</a></div></div></header>
<main class="reader-main"><article class="reader-page" id="readerText"></article><aside class="reader-controls"><div class="control-row"><div class="control-title"><span>Reading progress</span><strong id="progressValue">0%</strong></div><input id="progressSlider" type="range" min="0" max="100" step="1" value="0"></div><div class="control-row"><label for="fontSlider"><span>Text size</span><span>Aa</span></label><input id="fontSlider" type="range" min="16" max="28" step="1" value="20"></div><button class="btn btn-primary btn-full" id="markComplete" type="button">Mark as completed</button><p id="progressNote" style="color:var(--muted);font-size:.78rem;margin:14px 0 0">Reading progress sync status.</p></aside></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script><script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/reader.js"></script></body></html>
